<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>文档对象模型 - DOM - 基本认识</title>
  </head>
  <body>
    <h1>DOM（文档对象模型）</h1>
    <!-- 注释 -->
    <div id="divEl" class=".div">div标签内的文字内容<p>p标签内的文字内容</p></div>
    <script type="text/javascript">
      // 获取document对象
      console.log("typeof document:", typeof document); // 输出: object
      console.log("document:", document); // 输出: [object HTMLDocument]
      console.log("document.nodeName:", document.nodeName); // 输出: #document
      console.log("document.nodeType:", document.nodeType); // 输出: 9

      // 获取html元素
      var htmlEl = document.documentElement; // 获取html元素
      console.log("typeof htmlEl:", typeof htmlEl); // 输出: object
      console.log("htmlEl:", htmlEl); // 输出: <html lang="en">...</html>
      console.log("htmlEl.nodeName:", htmlEl.nodeName); // 输出: HTML
      console.log("htmlEl.nodeType:", htmlEl.nodeType); // 输出: 1

      // 获取head元素
      var headEl = document.head; // 获取head元素
      console.log("typeof headEl:", typeof headEl); // 输出: object
      console.log("headEl:", headEl); // 输出: <head>...</head>
      console.log("headEl.nodeName:", headEl.nodeName); // 输出: HEAD
      console.log("headEl.nodeType:", headEl.nodeType); // 输出: 1

      // 获取body元素
      var bodyEl = document.body; // 获取body元素
      console.log("typeof bodyEl:", typeof bodyEl); // 输出: object
      console.log("bodyEl:", bodyEl);
      console.log("bodyEl.nodeName:", bodyEl.nodeName); // 输出: BODY
      console.log("bodyEl.nodeType:", bodyEl.nodeType); // 输出: 1

      // 元素节点
      var divEl = document.getElementById("divEl"); // 获取id为divEl的元素
      console.log("typeof divEl:", typeof divEl); // 输出: object
      console.log("divEl:", divEl); // 输出: <div id="divEl" class=".div">div标签内的文字内容</div>
      console.log("divEl.nodeName:", divEl.nodeName); // 输出: DIV
      console.log("divEl.nodeType:", divEl.nodeType); // 输出: 1
      console.log("divEl.textContent:", divEl.textContent); // 输出: div标签内的文字内容
      console.log("divEl.innerHTML:", divEl.innerHTML); // 输出: div标签内的文字内容
      

      // 文本节点
      var textNode = divEl.firstChild; // 获取文本节点
      console.log("textNode:", textNode); // 输出: 文本节点
      console.log("textNode.nodeType:", textNode.nodeType); // 输出: 3 (表示文本节点)
      console.log("textNode.nodeValue:", textNode.nodeValue); // 输出: div标签内的文字内容

      // 属性节点
      var classAttr = divEl.getAttributeNode("class"); // 获取属性节点
      console.log("classAttr:", classAttr); // 输出: 属性节点
      console.log("classAttr.nodeType:", classAttr.nodeType); // 输出: 2 (表示属性节点)
      console.log("classAttr.nodeName:", classAttr.nodeName); // 输出: class
      console.log("classAttr.nodeValue:", classAttr.nodeValue); // 输出: .div

      // 注释节点
      var commentNode = null;
      // 遍历子节点，查找注释节点
      bodyEl.childNodes.forEach(function (node) {
        if (node.nodeType === 8) {
          // 8 表示注释节点
          commentNode = node;
        }
      });
      console.log("commentNode:", commentNode); // 输出: 注释节点
      console.log("commentNode.nodeType:", commentNode.nodeType); // 输出: 8
      console.log("commentNode.nodeValue:", commentNode.nodeValue); // 输出: 注释内容
    </script>
  </body>
</html>
