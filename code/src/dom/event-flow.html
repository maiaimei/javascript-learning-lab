<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>文档对象模型 - DOM - 事件流</title>
    <style>
      .outer {
        padding: 20px;
        background-color: lightblue;
      }
      .middle {
        padding: 20px;
        background-color: lightgreen;
      }
      .inner {
        padding: 20px;
        background-color: lightcoral;
      }
    </style>
  </head>
  <body>
    <p>
      捕获阶段：事件正在从根向目标元素捕获。通过将 addEventListener 的第三个参数设置为 true，可以监听捕获阶段的事件。
    </p>
    <p>冒泡阶段：事件从目标元素向上传递。然后向上传播到父元素，直到到达根元素。</p>
    <p>目标阶段：事件到达目标元素。事件在目标元素上触发。默认情况下，addEventListener 监听的是冒泡阶段的事件。</p>
    <p>
      当事件到达目标元素时，无论监听器是捕获阶段还是冒泡阶段，e.eventPhase 的值都会是 2，因为此时事件已经到达目标元素。
    </p>
    <div class="outer">
      Outer
      <div class="middle">
        Middle
        <div class="inner">Inner</div>
      </div>
    </div>

    <script>
      const outer = document.querySelector('.outer');
      const middle = document.querySelector('.middle');
      const inner = document.querySelector('.inner');

      // 添加事件监听器，捕获阶段和冒泡阶段均输出日志
      outer.addEventListener(
        'click',
        e => {
          console.log('Outer - 捕获阶段', e.eventPhase, e.currentTarget, e.target);
        },
        true
      ); // true 表示捕获阶段

      outer.addEventListener('click', e => {
        console.log('Outer - 冒泡阶段', e.eventPhase, e.currentTarget, e.target);
      });

      middle.addEventListener(
        'click',
        e => {
          console.log('Middle - 捕获阶段', e.eventPhase, e.currentTarget, e.target);
        },
        true
      );

      middle.addEventListener('click', e => {
        console.log('Middle - 冒泡阶段', e.eventPhase, e.currentTarget, e.target);
      });

      inner.addEventListener(
        'click',
        e => {
          console.log('Inner - 捕获阶段', e.eventPhase, e.currentTarget, e.target);
        },
        true
      );

      inner.addEventListener('click', e => {
        console.log('Inner - 目标阶段', e.eventPhase, e.currentTarget, e.target);
      });

      inner.addEventListener('click', e => {
        console.log('Inner - 冒泡阶段', e.eventPhase, e.currentTarget, e.target);
      });
    </script>
  </body>
</html>
